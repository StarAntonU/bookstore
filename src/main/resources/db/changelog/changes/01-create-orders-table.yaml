databaseChangeLog:
  - changeSet:
      id: create-orders-table
      author: Anton
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: ENUM('NEW','PAID','PACKED','DELIVERED','CANCELLED')
                  constraints:
                    nullable: false
              - column:
                  name: total
                  type: decimal(10,2)
              - column:
                  name: order_date
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: shipping_address
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: bit
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - addForeignKeyConstraint:
                  baseTableName: orders
                  constraintName: fk_orders_user
                  referencedTableName: users
                  baseColumnNames: user_id
                  referencedColumnNames: id
